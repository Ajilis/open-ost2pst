name: Windows Outlook Interop

on:
  workflow_dispatch:

jobs:
  outlook-interop:
    runs-on: [self-hosted, Windows, X64, outlook]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Generate interoperability PST
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          python scripts/generate_windows_interop_fixture.py --output artifacts/windows-interop.pst --manifest artifacts/windows-interop.expected.json
        shell: pwsh

      - name: Validate with SCANPST
        run: ./scripts/windows/validate_scanpst.ps1 -PstPath artifacts/windows-interop.pst -ReportPath artifacts/scanpst.report.json
        shell: pwsh

      - name: Validate with classic Outlook
        run: powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File scripts/windows/validate_outlook.ps1 -PstPath artifacts/windows-interop.pst -ExpectedManifest artifacts/windows-interop.expected.json -ReportPath artifacts/outlook.report.json
        shell: pwsh

      - name: Upload interoperability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-outlook-interop
          path: artifacts/
          if-no-files-found: error

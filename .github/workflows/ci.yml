name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest

  libpff:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system libpff bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pypff python3-venv

      - name: Create test environment
        run: |
          python3 -m venv --system-site-packages .venv-libpff
          .venv-libpff/bin/python -m pip install -e ".[dev]"

      - name: Validate generated PST with libpff
        run: .venv-libpff/bin/python -m pytest -q tests/test_libpff_ndb.py tests/test_libpff_pc.py tests/test_libpff_tc.py tests/test_libpff_messaging.py tests/test_libpff_recipients_attachments.py tests/test_libpff_convert.py tests/test_libpff_large_data.py tests/test_libpff_verify.py tests/test_libpff_siblock.py

  windows-harness:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Generate Windows interoperability fixture
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          python scripts/generate_windows_interop_fixture.py --output artifacts/windows-interop.pst --manifest artifacts/windows-interop.expected.json
        shell: pwsh

      - name: Check fixture
        run: python -c "import json, pathlib; p=pathlib.Path('artifacts/windows-interop.pst'); m=json.loads(pathlib.Path('artifacts/windows-interop.expected.json').read_text(encoding='utf-8')); assert p.read_bytes()[:4] == b'!BDN'; assert m['folder_count'] == 3; assert m['message_count'] == 3; assert m['attachment_count'] == 342"

      - name: Parse PowerShell validators
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            "scripts/windows/validate_scanpst.ps1",
            "scripts/windows/validate_outlook.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $file"
            }
          }
        shell: pwsh

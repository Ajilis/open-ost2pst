name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest

  libpff:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system libpff bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pypff python3-venv

      - name: Create test environment
        run: |
          python3 -m venv --system-site-packages .venv-libpff
          .venv-libpff/bin/python -m pip install -e ".[dev]"

      - name: Validate generated PST with libpff
        run: .venv-libpff/bin/python -m pytest -q tests/test_libpff_ndb.py tests/test_libpff_pc.py tests/test_libpff_tc.py
